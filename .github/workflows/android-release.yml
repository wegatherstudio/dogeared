name: Android APK

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub
# Release. Pushes to the Android working branch build the APK too (without
# releasing it) so breakage shows up before a tag is cut.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/android-app-version-**'
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Derive version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-dev"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Building version ${NAME} (code ${GITHUB_RUN_NUMBER})"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          echo "Keystore restored ($(stat -c%s android/keystore.jks) bytes)"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PversionCode=${GITHUB_RUN_NUMBER} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Verify the APK is signed with the expected key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          # Must match the fingerprint published in assetlinks.json at the site
          # root, or the installed app shows a browser address bar.
          EXPECTED="05f3a0f63d2b76ddd49d11809ea5bf1adcce45aa9275423aa50deeec0df4b85c"
          ACTUAL=$(grep -i 'SHA-256 digest' certs.txt | head -1 | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate does not match assetlinks.json."
            echo "::error::expected $EXPECTED"
            echo "::error::got      $ACTUAL"
            exit 1
          fi
          echo "Signature matches assetlinks.json."

      - name: Name the APK
        id: apk
        run: |
          NAME="dogeared-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "path=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" \
            --title "Dogeared ${{ steps.version.outputs.name }} for Android" \
            --notes "$(cat <<'NOTES'
          Download `dogeared-${{ steps.version.outputs.name }}.apk` below to install Dogeared on Android.

          **[Step-by-step install instructions →](https://wegatherstudio.github.io/dogeared/install-android.html)**

          Android will warn you about installing from an unknown source — that is expected for any app distributed outside the Play Store. The install guide walks through it.

          Your shelf, journal and stats are the same ones you have on the web. Sign in with the same Google account and everything syncs across both.
          NOTES
          )" || gh release upload "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" --clobber
